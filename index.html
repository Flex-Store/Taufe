<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glückwunsch zur Taufe</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #2d3748;
      overflow-x: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 480px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      position: relative;
    }
    /* Interaktive Taube Animation */
    .dove-container {
      font-size: 60px;
      margin-bottom: 10px;
      display: inline-block;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      animation: flyIn 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards, gentleFloat 4s ease-in-out infinite 1.8s;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .dove-container:hover {
      transform: scale(1.15) rotate(5deg);
    }
    .dove-container:active {
      transform: scale(0.9) rotate(-10deg);
    }
    .tap-hint {
      font-size: 12px;
      color: #718096;
      margin-bottom: 15px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      color: #1a202c;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 15px;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      color: #2b6cb0;
      font-weight: 600;
      font-style: italic;
      margin-bottom: 12px;
    }
    .date-badge {
      background: rgba(255, 255, 255, 0.8);
      padding: 8px 18px;
      border-radius: 20px;
      display: inline-block;
      font-size: 14px;
      color: #4a5568;
      font-weight: 600;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    /* Bibelvers-Sektion */
    .verse-box {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      padding: 22px 20px;
      margin-top: 5px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .verse-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      color: #2d3748;
      font-style: italic;
      line-height: 1.45;
      margin-bottom: 10px;
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }
    .verse-ref {
      font-size: 13px;
      color: #3182ce;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: opacity 0.3s ease;
    }

    /* Keyframe Animationen */
    @keyframes flyIn {
      0% {
        opacity: 0;
        transform: translate(-150px, -100px) scale(0.3) rotate(-20deg);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes cardAppear {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="dove-container" onclick="nextVerse()" title="Klicke auf die Taube für einen neuen Vers">🕊️</div>
    <div class="tap-hint">✨ Tippe auf die Taube für einen Bibelvers</div>
    
    <h1>Glückwunsch zur Taufe</h1>
    <div class="subtitle">Segen für</div>
    <div class="name" id="nameDisplay">Estera</div>
    <div class="date-badge" id="dateDisplay">20. September 2026</div>

    <div class="verse-box" id="verseBox">
      <div class="verse-text" id="verseText">„Gott hat seinen Engeln befohlen, dass sie dich behüten auf allen deinen Wegen.“</div>
      <div class="verse-ref" id="verseRef">Psalm 91,11</div>
    </div>
  </div>

  <script>
    // 30 Schöne Bibelverse zur Taufe
    const verses = [
      { text: "Gott hat seinen Engeln befohlen, dass sie dich behüten auf allen deinen Wegen.", ref: "Psalm 91,11" },
      { text: "Der Herr ist mein Hirte, mir wird nichts mangeln.", ref: "Psalm 23,1" },
      { text: "Ich bin das Licht der Welt. Wer mir nachfolgt, wird nicht wandeln in der Finsternis.", ref: "Johannes 8,12" },
      { text: "Gott ist die Liebe; und wer in der Liebe bleibt, der bleibt in Gott und Gott in ihm.", ref: "1. Johannes 4,16" },
      { text: "Niemals werde ich dir meine Hilfe entziehen, nie dich im Stich lassen.", ref: "Josua 1,5" },
      { text: "Siehe, ich bin bei euch alle Tage bis an der Welt Ende.", ref: "Matthäus 28,20" },
      { text: "Der Herr segne dich und behüte dich.", ref: "4. Mose 6,24" },
      { text: "Alle eure Dinge lasst in der Liebe geschehen!", ref: "1. Korinther 16,14" },
      { text: "Gott hat uns nicht gegeben den Geist der Furcht, sondern der Kraft und der Liebe und der Besonnenheit.", ref: "2. Timotheus 1,7" },
      { text: "Lass dich nicht vom Bösen überwinden, sondern überwinde das Böse mit Gutem.", ref: "Römer 12,21" },
      { text: "Du machst mir kund den Weg zum Leben: Vor dir ist Freude die Fülle.", ref: "Psalm 16,11" },
      { text: "Ich danke dir dafür, dass ich erstaunlich wunderbar gemacht bin.", ref: "Psalm 139,14" },
      { text: "Der Herr ist mein Licht und mein Heil; vor wem sollte ich mich fürchten?", ref: "Psalm 27,1" },
      { text: "Seid fröhlich in Hoffnung, geduldig in Trübsal, beharrlich im Gebet.", ref: "Römer 12,12" },
      { text: "Von allen Seiten umgibst du mich und hältst deine Hand über mir.", ref: "Psalm 139,5" },
      { text: "Die auf den Herrn harren, kriegen neue Kraft, dass sie auffahren mit Flügeln wie Adler.", ref: "Jesaja 40,31" },
      { text: "Befiehl dem Herrn deine Wege und hoffe auf ihn, er wird’s wohlmachen.", ref: "Psalm 37,5" },
      { text: "Fürchte dich nicht, denn ich bin mit dir; weiche nicht, denn ich bin dein Gott.", ref: "Jesaja 41,10" },
      { text: "Ein Mensch sieht, was vor Augen ist; der Herr aber sieht das Herz an.", ref: "1. Samuel 16,7" },
      { text: "Der Herr ist meine Stärke und mein Schild; auf ihn hofft mein Herz.", ref: "Psalm 28,7" },
      { text: "Vertraue auf den Herrn von ganzem Herzen.", ref: "Sprüche 3,5" },
      { text: "Ich will dich nicht verlassen noch von dir weichen.", ref: "Josua 1,5" },
      { text: "Gott ist unsere Zuversicht und Stärke, eine Hilfe in den großen Nöten.", ref: "Psalm 46,2" },
      { text: "Suche deine Freude am Herrn, so wird er dir geben, was dein Herz begehrt.", ref: "Psalm 37,4" },
      { text: "Wo du hingehst, da will auch ich hingehen; wo du bleibst, da bleibe ich auch.", ref: "Rut 1,16" },
      { text: "Meine Zeit steht in deinen Händen.", ref: "Psalm 31,16" },
      { text: "Er wird seinen Engeln befehlen, dich zu behüten auf allen deinen Wegen.", ref: "Lukas 4,10" },
      { text: "Lass deine Güte über uns sein, wie wir auf dich hoffen.", ref: "Psalm 33,22" },
      { text: "Gott ist die Liebe, und wer in der Liebe bleibt, bleibt in Gott.", ref: "1. Johannes 4,16" },
      { text: "Der Herr behüte deinen Ausgang und Eingang von nun an bis in Ewigkeit.", ref: "Psalm 121,8" }
    ];

    // Parameter aus der URL auslesen
    const urlParams = new URLSearchParams(window.location.search);
    const nameParam = urlParams.get('name');
    const datumParam = urlParams.get('datum');

    if (nameParam) {
      document.getElementById('nameDisplay').innerText = nameParam;
    }
    if (datumParam) {
      document.getElementById('dateDisplay').innerText = datumParam;
    }

    // Wechselt den Bibelvers beim Klick auf die Taube mit sanfter Überblendung
    function nextVerse() {
      const randomIndex = Math.floor(Math.random() * verses.length);
      const verseText = document.getElementById('verseText');
      const verseRef = document.getElementById('verseRef');

      verseText.style.opacity = '0';
      verseRef.style.opacity = '0';

      setTimeout(() => {
        verseText.innerText = "„" + verses[randomIndex].text + "“";
        verseRef.innerText = verses[randomIndex].ref;
        verseText.style.opacity = '1';
        verseRef.style.opacity = '1';
      }, 250);
    }

    // Konfetti-Effekt beim Laden der Seite
    window.addEventListener('load', () => {
      const duration = 2 * 1000;
      const animationEnd = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 2,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#8ec5fc', '#e0c3fc', '#ffffff']
        });
        confetti({
          particleCount: 2,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#8ec5fc', '#e0c3fc', '#ffffff']
        });

        if (Date.now() < animationEnd) {
          requestAnimationFrame(frame);
        }
      }());
    });
  </script>

</body>
</html>
