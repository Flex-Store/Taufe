<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glückwunsch zur Taufe</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 450px;
      width: 100%;
      animation: fadeInUp 1.2s ease-out forwards;
      border: 1px solid rgba(255,255,255,0.8);
    }
    .icon {
      font-size: 50px;
      margin-bottom: 15px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      color: #2c3e50;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 16px;
      color: #7f8c8d;
      margin-bottom: 25px;
      font-weight: 300;
    }
    .name {
      font-family: 'Cinzel', serif;
      font-size: 32px;
      color: #3498db;
      font-weight: 700;
      margin: 15px 0;
      text-transform: capitalize;
    }
    .date-box {
      background: #f0f4f8;
      padding: 12px 20px;
      border-radius: 30px;
      display: inline-block;
      font-size: 14px;
      color: #555;
      font-weight: 600;
      margin-top: 15px;
      letter-spacing: 0.5px;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🕊️</div>
    <h1>Glückwunsch zur Taufe</h1>
    <div class="subtitle">Liebe/r</div>
    <div class="name" id="nameDisplay">Lieber Gast</div>
    <div class="date-box" id="dateDisplay">am 20. September 2026</div>
  </div>

  <script>
    // Parameter aus der URL auslesen
    const urlParams = new URLSearchParams(window.location.search);
    const nameParam = urlParams.get('name');
    const datumParam = urlParams.get('datum');

    if (nameParam) {
      document.getElementById('nameDisplay').innerText = nameParam;
    }
    if (datumParam) {
      document.getElementById('dateDisplay').innerText = 'am ' + datumParam;
    }

    // Konfetti-Effekt beim Laden der Seite
    window.addEventListener('load', () => {
      const duration = 2.5 * 1000;
      const animationEnd = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 3,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#3498db', '#a8e6cf', '#ffd3b6']
        });
        confetti({
          particleCount: 3,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#3498db', '#a8e6cf', '#ffd3b6']
        });

        if (Date.now() < animationEnd) {
          requestAnimationFrame(frame);
        }
      }());
    });
  </script>

</body>
</html>
