<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alles Gute!</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    h1 {
      font-size: 32px;
      color: #2b6cb0;
      margin-bottom: 15px;
      animation: popIn 0.8s ease-out;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
      color: #4a5568;
      margin-bottom: 25px;
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Format */
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .video-container iframe, 
    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎉 Alles Gute! 🎉</h1>
    
    <p>
      Wir wünschen dir von Herzen alles Gute, Gottes Segen und einen wunderschönen Tag! 
      Schön, dass es dich gibt. Hier ist ein besonderes Video für dich:
    </p>

    <div class="video-container">
      <iframe 
        src="https://www.youtube-nocookie.com/embed/DEINE_YOUTUBE_VIDEO_ID" 
        title="Dein Video" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <script>
    // Konfetti-Explosion direkt beim Öffnen der Seite
    window.addEventListener('load', () => {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    });
  </script>

</body>
</html>
